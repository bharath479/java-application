# This is a sample Spring Boot application-test.yml configuration file for testing purposes. It configures an in-memory H2 database and sets up JPA and Flyway for database migrations.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
