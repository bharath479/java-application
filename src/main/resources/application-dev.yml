spring:
  datasource:
    url: jdbc:h2:mem:demodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    locations: classpath:db/migration

logging:
  level:
    com.example.demo: DEBUG
