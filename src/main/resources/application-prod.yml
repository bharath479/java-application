spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/demodb}
    username: ${DB_USERNAME:demo}
    password: ${DB_PASSWORD:demo}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.example.demo: INFO
